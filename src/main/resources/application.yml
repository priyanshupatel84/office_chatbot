server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: cpp-support-chatbot
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cpp_chatbot}
    username: ${DB_USERNAME:cpp_chatbot}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  docker:
    compose:
      enabled: false

chatbot:
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    chat-model: ${OLLAMA_CHAT_MODEL:qwen3:8b}
    timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:120}
  embedding:
    model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text-v2-moe}
    dimensions: ${OLLAMA_EMBEDDING_DIMENSIONS:768}
  retrieval:
    top-k: ${RETRIEVAL_TOP_K:5}
    similarity-threshold: ${RETRIEVAL_SIMILARITY_THRESHOLD:0.35}
  knowledge:
    file: ${KNOWLEDGE_FILE_PATH:knowledge/knowledge-base.json}
  conversation:
    history-limit: ${CHAT_HISTORY_LIMIT:12}
  prompt:
    location: ${CHAT_PROMPT_LOCATION:classpath:prompts/cloud-support-prompt-template.txt}
